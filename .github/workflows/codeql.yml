name: CodeQL

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            AudioNorm+.csproj
            tests/AudioNorm.Tests/AudioNorm.Tests.csproj

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.3
        with:
          languages: csharp
          queries: security-extended,security-and-quality

      - name: Restore NuGet packages
        run: dotnet restore .\tests\AudioNorm.Tests\AudioNorm.Tests.csproj

      - name: Build for CodeQL
        run: dotnet build .\tests\AudioNorm.Tests\AudioNorm.Tests.csproj --configuration Release --no-restore

      - name: Analyze
        uses: github/codeql-action/analyze@v4.37.3
